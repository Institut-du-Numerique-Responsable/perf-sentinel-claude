schema_version: "1.0"
name: no-trigger-typo
description: An unrelated small request never starts the skill.
tags: [trigger, negative]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: fix the typo in README
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git diff:*)", "Bash(git log:*)", "Bash(git status:*)", "Bash(git merge-base:*)"]
graders:
  - type: tool_used
    name: skill-not-started
    tool: Skill
    input_match: perf-tests
    min: 0
    max: 0
    arm: both
  - type: llm
    name: handles-only-the-typo
    focus: trace
    criteria: |
      The agent finds the typo in README.md, which is "recieve" instead of "receive", and fixes it or says exactly how to fix it.
      It does not start any performance testing flow. It does not ask about data volumes, does not list scenarios
      and does not look at the OpenTelemetry setup or the CI configuration.
