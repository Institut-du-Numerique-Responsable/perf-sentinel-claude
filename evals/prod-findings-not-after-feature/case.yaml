schema_version: "1.0"
name: prod-findings-not-after-feature
description: Finishing a feature never starts or proposes the production findings skill.
tags: [prod-findings, trigger, negative]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I'm done with the feature that loads a client's contracts, can you review it?
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, "Bash(python3:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git status:*)", "Bash(git merge-base:*)"]
graders:
  - type: tool_used
    name: prod-findings-not-started
    tool: Skill
    input_match: prod-findings
    min: 0
    max: 0
    arm: both
  - type: llm
    name: does-not-propose-prod-findings
    criteria: |
      The reply does not propose, mention or suggest running /perf-sentinel:prod-findings, and does not talk about reading
      production findings from a Perf Sentinel Hub. (Proposing /perf-sentinel:perf-tests is allowed and not judged here.)
