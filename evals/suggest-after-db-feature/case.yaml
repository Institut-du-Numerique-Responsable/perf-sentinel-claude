schema_version: "1.0"
name: suggest-after-db-feature
description: Claude suggests the skill in one line when a finished feature touches the database, and waits for a yes.
tags: [trigger, suggestion]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I'm done with the feature that loads a client's contracts, can you review it?
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, "Bash(git diff:*)", "Bash(git log:*)", "Bash(git status:*)", "Bash(git merge-base:*)"]
graders:
  - type: tool_used
    name: skill-not-started
    tool: Skill
    input_match: perf-tests
    min: 0
    max: 0
    arm: both
  - type: llm
    name: proposes-the-command-in-one-line
    criteria: |
      Besides the review itself, the reply proposes running /perf-sentinel:perf-tests.
      The proposal is short, about one line, and it is phrased as an offer or a question.
      It gives a reason tied to the diff, such as database queries issued per contract.
      The exact command /perf-sentinel:perf-tests appears in the reply.
  - type: llm
    name: waits-for-a-yes
    focus: trace
    criteria: |
      The run does not write or edit any file and does not create any test.
      The reply does not describe performance tests as already written or as about to be written.
      It does not start the skill's workflow, meaning it does not list scenarios or ask a series of business questions
      about data volumes. It stops after the review and the one-line offer.
