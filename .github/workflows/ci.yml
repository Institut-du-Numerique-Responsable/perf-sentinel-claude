name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts/test_check_plugin.py
      - run: python3 scripts/check_plugin.py .
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
